name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: bin/
          additional_files: install.sh uninstall.sh install-codex.sh
          severity: error

  test-claude:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Claude-side tests (accounts + scan-tokens)
        run: python3 -m pytest test/test_accounts.py test/test_scan_tokens.py -q

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: |
          if command -v jq >/dev/null; then echo "jq already installed"; else
            if [ "$(uname)" = "Darwin" ]; then brew install jq; else sudo apt-get install -y jq; fi
          fi
      - name: Test empty input
        run: |
          OUTPUT=$(echo '' | bash bin/statusline.sh)
          [ "$OUTPUT" = "Claude" ] || { echo "FAIL: expected 'Claude', got '$OUTPUT'"; exit 1; }
          echo "PASS: empty input returns 'Claude'"
      - name: Test install script (dry run)
        run: |
          mkdir -p ~/.claude
          echo '{"permissions":{}}' > ~/.claude/settings.json
          bash install.sh
          [ -f ~/.claude/statusline.sh ] || { echo "FAIL: script not installed"; exit 1; }
          jq -e '.statusLine' ~/.claude/settings.json || { echo "FAIL: settings not patched"; exit 1; }
          echo "PASS: install script works"
      - name: Test ledger functions
        run: bash test/test_ledger.sh
      - name: Test transcript backups
        run: bash test/test_backup_scripts.sh
      - name: Test Codex monitor
        run: python3 test/test_codex_statusline.py
      - name: Set up Python 3.9
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Test Codex monitor on Python 3.9
        if: runner.os == 'Linux'
        run: python3.9 test/test_codex_statusline.py
